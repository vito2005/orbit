# Дашборд живёт на своём сервере в Петербурге (Railway из России не открывается).
# Бот остаётся на Railway и деплоится сам — ему заграница нужна ради OpenAI.
name: deploy dashboard

on:
    push:
        branches: [main]
        paths:
            - 'apps/dashboard/**'
            - 'packages/shared/**'
            - 'bun.lock'
            - 'package.json'
            - '.github/workflows/deploy-dashboard.yml'
    workflow_dispatch:

concurrency:
    group: deploy-dashboard
    cancel-in-progress: false

jobs:
    deploy:
        runs-on: ubuntu-latest
        steps:
            # Ключ ограничен в authorized_keys через command=, поэтому голый ssh
            # запускает /opt/orbit/deploy.sh и ничего больше — шелла по нему не дать.
            - name: Собрать и перезапустить на сервере
              env:
                  DEPLOY_KEY: ${{ secrets.DASHBOARD_DEPLOY_KEY }}
                  KNOWN_HOSTS: ${{ secrets.DASHBOARD_KNOWN_HOSTS }}
              run: |
                  mkdir -p ~/.ssh
                  printf '%s\n' "$DEPLOY_KEY" > ~/.ssh/id_ed25519
                  chmod 600 ~/.ssh/id_ed25519
                  printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
                  ssh -i ~/.ssh/id_ed25519 root@94.241.139.59
